name: Idea or research question / 想法或研究问题
description: Propose something to discuss, research or verify / 提出需要共同讨论、研究或验证的问题
title: "[Idea] "
labels:
  - discussion
body:
  - type: markdown
    attributes:
      value: |
        Use the language in which you can think most accurately. English is not required.
        请使用你最自然、最准确的语言。参与不要求英语。

        An AI assistant may complete this form for you, but it must preserve your original meaning and obtain your confirmation before submission.
        AI可以代你整理和填写，但必须保留原意，并在提交前取得你的确认。

  - type: input
    id: source_language
    attributes:
      label: Source language / 原始语言
      description: Use a BCP 47 language tag / 请使用BCP 47语言标签
      placeholder: zh-CN / en / ja / es / ar
    validations:
      required: true

  - type: textarea
    id: original_statement
    attributes:
      label: Original idea or question / 原始想法或问题
      description: What do you actually want to discuss or verify? Keep your original expression when possible. / 你真正想讨论或验证什么？请尽量保留原始表达。
    validations:
      required: true

  - type: textarea
    id: bridge_summary
    attributes:
      label: Optional bridge summary / 可选桥接摘要
      description: A short English or other-language summary for wider discovery. This is optional and may be AI-generated if marked. / 用英文或其他语言提供便于检索的简短摘要。非必填；AI生成时请标明。

  - type: textarea
    id: context
    attributes:
      label: Context and motivation / 背景与动机
      description: Why does this matter? What observation, project, experience or conversation led to it? / 为什么重要？来自什么观察、项目、经历或对话？

  - type: textarea
    id: evidence
    attributes:
      label: Existing sources or evidence / 已有资料或证据
      description: Provide verifiable sources where possible, or say that evidence is not yet available. / 尽量提供可核查来源；尚无资料也可以说明。

  - type: textarea
    id: uncertainty
    attributes:
      label: Uncertainty and counterexamples / 不确定性与反例
      description: What might be wrong? What evidence would change your view? / 哪些地方可能错误？什么证据会改变你的判断？

  - type: dropdown
    id: ai_assistance_status
    attributes:
      label: AI assistance / AI辅助情况
      options:
        - No AI assistance / 未使用AI
        - AI-assisted and human-reviewed / 使用AI且已人工审阅
        - AI-assisted but not fully verified / 使用AI但尚未完整核查
    validations:
      required: true

  - type: textarea
    id: ai_assistance_details
    attributes:
      label: AI role and disclosure / AI角色与披露
      description: Model/provider, roles, translation method and human changes. Do not disclose private prompts. / 可填写模型、角色、翻译方式及人工修改情况；无需公开私人提示词。

  - type: checkboxes
    id: public_authorization
    attributes:
      label: Public authorization / 公开授权
      options:
        - label: I confirm that I may publish this content and have removed private data, credentials and unauthorized material. / 我确认有权公开这些内容，并已移除隐私、密钥和未授权材料。
          required: true
        - label: I reviewed the final public text, including any AI-generated translation or rewrite. / 我已审阅最终公开文本，包括AI生成的翻译或改写。
          required: true