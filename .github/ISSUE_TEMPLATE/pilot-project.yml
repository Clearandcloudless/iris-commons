name: 公益试验项目提案
about: 提议一个真实课题，用于验证Iris Commons协作流程
title: "[Pilot] "
labels:
  - pilot
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的公益问题
      description: 请给出具体、有限、可验证的问题，而不是宽泛主题。
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: 受益对象与公共价值
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: 可交付成果
      description: 例如开放报告、数据说明、原型、复现实验或公共指南。
    validations:
      required: true
  - type: textarea
    id: collaboration
    attributes:
      label: 为什么需要跨语言或人机协作？
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据、资料和许可证
      description: 数据从哪里来？是否包含个人、受限或高风险信息？
  - type: textarea
    id: method
    attributes:
      label: 初步方法与验证标准
  - type: textarea
    id: risks
    attributes:
      label: 伦理、安全、隐私与误用风险
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: 需要的参与者和能力
  - type: input
    id: language
    attributes:
      label: 提案原始语言
      placeholder: zh-CN / en / ja / other
    validations:
      required: true
  - type: dropdown
    id: ai_used
    attributes:
      label: 是否使用AI辅助？
      options:
        - 否
        - 是，已人工审阅
        - 是，但尚未完整核查
    validations:
      required: true
  - type: textarea
    id: ai_details
    attributes:
      label: AI参与说明
