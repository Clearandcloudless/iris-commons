name: Public-interest pilot project / 公益试验项目提案
description: Propose a small real project that tests the Iris Commons workflow / 提议小型真实课题以验证Iris Commons协作流程
title: "[Pilot] "
labels:
  - pilot
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        The first pilot should expose collaboration problems, not maximize topic size. Prefer a one-to-two-week, publicly verifiable project using public sources and at least two language, regional or professional perspectives.
        首个试验应优先暴露协作机制问题，而不是追求课题规模。建议使用公开资料、可在1—2周完成首轮，并需要至少两种语言、地区或专业视角。

        Read `research/pilots/SELECTION_AND_METRICS.md` for the current selection and evaluation rules. An AI assistant may complete this form, but it must preserve your meaning and obtain confirmation before submission.
        当前选择和评估规则见`research/pilots/SELECTION_AND_METRICS.md`。AI可以代为填写，但必须保留原意并在提交前取得确认。

  - type: input
    id: source_language
    attributes:
      label: Source language / 提案原始语言
      description: Use a BCP 47 language tag / 请使用BCP 47语言标签
      placeholder: zh-CN / en / ja / es / ar
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Public-interest problem / 要解决的公益问题
      description: Define a specific, limited and verifiable problem rather than a broad topic. / 请给出具体、有限、可验证的问题，而不是宽泛主题。
    validations:
      required: true

  - type: textarea
    id: original_statement
    attributes:
      label: Original proposal / 原始提案表达
      description: Preserve the proposer's original wording where it carries meaning or context. / 对具有语义和语境价值的内容保留提案者原始表达。

  - type: textarea
    id: bridge_summary
    attributes:
      label: Optional bridge summary / 可选桥接摘要
      description: A short English or other-language summary for cross-language discovery. Mark AI-generated summaries. / 用英文或其他语言提供便于跨语言发现的摘要；AI生成时请标明。

  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries and public value / 受益对象与公共价值
    validations:
      required: true

  - type: textarea
    id: workflow_validation
    attributes:
      label: Workflow validation value / 协作流程验证价值
      description: Which onboarding, multilingual, classification, routing, evidence or review problems will this pilot test? / 本课题将验证哪些新人入口、多语言、分类、路由、证据或审查问题？
    validations:
      required: true

  - type: textarea
    id: disagreement
    attributes:
      label: Expected disagreement or uncertainty / 预期分歧或不确定性
      description: What genuine disagreement, competing interpretation or failure condition may appear? / 可能出现哪些真实分歧、竞争性解释或失败条件？
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: First-iteration timebox / 首轮时间盒
      description: Prefer roughly one to two weeks. / 建议首轮约1—2周。
      placeholder: 7 days / 14 days / other
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Verifiable deliverables / 可验证交付成果
      description: Open report, source register, prototype, reproduction, comparison or public guide. / 例如开放报告、来源清单、原型、复现、比较报告或公共指南。
    validations:
      required: true

  - type: textarea
    id: collaboration_need
    attributes:
      label: Why multilingual or human-AI collaboration is needed / 为什么需要跨语言或人机协作
    validations:
      required: true

  - type: textarea
    id: data_and_license
    attributes:
      label: Data, sources and licenses / 数据、资料和许可证
      description: Use public material where possible. Identify personal, restricted or high-risk information. / 优先使用公开资料，并说明是否包含个人、受限或高风险信息。
    validations:
      required: true

  - type: textarea
    id: independent_verification
    attributes:
      label: Independent verification / 独立复核方法
      description: How can another participant review the same evidence without private founder-controlled resources? / 第三方如何基于同一证据复核，且不依赖发起者掌握的内部资源？
    validations:
      required: true

  - type: textarea
    id: method_and_validation
    attributes:
      label: Initial method and validation criteria / 初步方法与验证标准
    validations:
      required: true

  - type: textarea
    id: process_metrics
    attributes:
      label: Process metrics / 过程指标
      description: Include onboarding time, AI corrections, classification/routing, translation drift, evidence conflict and protocols actually used. / 建议包含首次贡献时间、AI纠正次数、分类路由、翻译失真、证据冲突及实际使用的协议。
    validations:
      required: true

  - type: textarea
    id: minimum_team
    attributes:
      label: Minimum execution team / 最小执行团队
      description: Can one human and two AI client configurations complete a minimum loop? Who else is needed? / 1名人类和2类AI客户端能否完成最小闭环？还需要谁？

  - type: textarea
    id: risks
    attributes:
      label: Ethics, safety, privacy and misuse risks / 伦理、安全、隐私与误用风险
    validations:
      required: true

  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop or narrowing conditions / 停止或缩小范围条件
      description: What evidence or risk should cause the pilot to pause, narrow or end? / 出现什么证据或风险时应暂停、缩小范围或结束？
    validations:
      required: true

  - type: dropdown
    id: ai_assistance_status
    attributes:
      label: AI assistance / AI辅助情况
      options:
        - No AI assistance / 未使用AI
        - AI-assisted and human-reviewed / 使用AI且已人工审阅
        - AI-assisted but not fully verified / 使用AI但尚未完整核查
    validations:
      required: true

  - type: textarea
    id: ai_assistance_details
    attributes:
      label: AI role and disclosure / AI角色与披露
      description: Model/provider, roles, translation method and human changes. Do not disclose private prompts. / 可填写模型、角色、翻译方式及人工修改情况；无需公开私人提示词。

  - type: checkboxes
    id: public_authorization
    attributes:
      label: Public authorization / 公开授权
      options:
        - label: I confirm that I may publish this proposal and have removed private data, credentials and unauthorized material. / 我确认有权公开该提案，并已移除隐私、密钥和未授权材料。
          required: true
        - label: I reviewed the final public text, including AI-generated translations or rewrites. / 我已审阅最终公开文本，包括AI生成的翻译或改写。
          required: true
